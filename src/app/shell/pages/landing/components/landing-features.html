<section id="features" class="features-section">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="display-6 fw-700 mb-3">Built around the whole business</h2>
      <p class="lead text-muted">
        Every module reads the same records, so nothing has to be reconciled by hand.
      </p>
    </div>

    <div class="row g-4">
      @for (feature of features; track feature.title) {
        <div class="col-md-6 col-lg-4">
          <div class="feature-card">
            <div class="feature-image mb-4">
              <img
                [ngSrc]="feature.image"
                [alt]="feature.title"
                width="1315"
                height="1332"
                class="img-fluid rounded-4"
              />
            </div>
            <h3 class="h4 fw-700 mb-3">{{ feature.title }}</h3>
            <p class="text-muted">{{ feature.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
