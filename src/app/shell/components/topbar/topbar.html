<div class="d-flex flex-grow-1 w-100 me-auto align-items-center">
  <button
    type="button"
    class="mobile-menu-icon me-2 d-flex d-sm-flex d-md-flex d-lg-none flex-shrink-0"
    aria-label="Toggle navigation"
    (click)="layout.toggleMobileMenu()"
  >
    <svg class="sa-icon" aria-hidden="true">
      <use href="/assets/icons/sprite.svg#menu"></use>
    </svg>
  </button>

  <button
    type="button"
    class="collapse-icon me-3 d-none d-lg-inline-flex"
    aria-label="Collapse sidebar"
    (click)="layout.toggleNavMinified()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5 8" aria-hidden="true">
      <polygon fill="#878787" points="4.5,1 3.8,0.2 0,4 3.8,7.8 4.5,7 1.5,4" />
    </svg>
  </button>

  <form class="app-search" role="search" autocomplete="off">
    <label class="visually-hidden" for="topbar-search">Search</label>
    <input id="topbar-search" type="text" class="form-control" placeholder="Search for anything" />
  </form>
</div>

<button
  type="button"
  class="btn btn-system"
  aria-label="Toggle colour theme"
  (click)="layout.toggleTheme()"
>
  <svg class="sa-icon sa-icon-2x sa-mode-light" aria-hidden="true">
    <use href="/assets/icons/sprite.svg#sun"></use>
  </svg>
  <svg class="sa-icon sa-icon-2x sa-mode-dark" aria-hidden="true">
    <use href="/assets/icons/sprite.svg#moon"></use>
  </svg>
</button>

<app-profile-dropdown />
