<a
  [routerLink]="link()"
  class="app-logo flex-shrink-0 d-flex align-items-center text-decoration-none"
>
  <div class="logo-blob-wrapper d-flex align-items-center gap-2">
    <div class="logo-backdrop-inline">
      <div class="blobs">
        <svg viewBox="0 0 1200 1200" aria-hidden="true" focusable="false">
          <g class="blob blob-1">
            <path d="M 100 600 q 0 -700, 500 -500 t 500 500 t -500 500 T 100 600 z" />
          </g>
          <g class="blob blob-2">
            <path d="M 100 600 q -50 -400, 500 -500 t 450 550 t -500 500 T 100 600 z" />
          </g>
          <g class="blob blob-3">
            <path d="M 100 600 q 0 -400, 500 -500 t 400 500 t -500 500 T 100 600 z" />
          </g>
          <g class="blob blob-4">
            <path d="M 150 600 q 0 -600, 500 -500 t 500 550 t -500 500 T 150 600 z" />
          </g>
          <g class="blob blob-1 alt">
            <path d="M 150 600 q 0 -600, 500 -500 t 500 550 t -500 500 T 150 600 z" />
          </g>
          <g class="blob blob-2 alt">
            <path d="M 100 600 q 100 -600, 500 -500 t 400 500 t -500 500 T 100 600 z" />
          </g>
          <g class="blob blob-3 alt">
            <path d="M 100 600 q 0 -400, 500 -500 t 400 500 t -500 500 T 100 600 z" />
          </g>
          <g class="blob blob-4 alt">
            <path d="M 150 600 q 0 -600, 500 -500 t 500 550 t -500 500 T 150 600 z" />
          </g>
        </svg>
      </div>
      <svg class="logo-mark" viewBox="-2 0 32 32" aria-hidden="true" focusable="false">
        <g class="orbit-ring orbit-ring-1">
          <path
            d="M18.4133 24.4076C11.6255 28.5669 4.16789 28.3448 1.75623 23.9115C-0.655423 19.4782 2.89215 12.5126 9.67995 8.35334C16.4678 4.19407 23.9254 4.41619 26.337 8.84946C28.7487 13.2827 25.2011 20.2484 18.4133 24.4076Z"
          />
        </g>
        <g class="orbit-ring orbit-ring-2">
          <path
            d="M18.4134 8.35329C25.2012 12.5126 28.7487 19.4782 26.3371 23.9114C23.9254 28.3447 16.4678 28.5668 9.67997 24.4076C2.89217 20.2483 -0.655402 13.2827 1.75625 8.84941C4.16791 4.41615 11.6255 4.19402 18.4134 8.35329Z"
          />
        </g>
        <g class="orbit-ring orbit-ring-3">
          <path
            d="M22.6276 16C22.6276 24.2843 18.7858 31 14.0467 31C9.30755 31 5.46573 24.2843 5.46573 16C5.46573 7.71573 9.30755 1 14.0467 1C18.7858 1 22.6276 7.71573 22.6276 16Z"
          />
        </g>
        <ellipse class="orbit-core" cx="14.0467" cy="16.5173" rx="4.01435" ry="4.13793" />
      </svg>
    </div>
    <span class="logo-text fw-bold text-white">
      {{ mainText() }}
      <span class="text-white-50 fw-normal">{{ secondaryText() }}</span>
    </span>
  </div>
</a>
